# Nginx Configuration for Floral Whispers Gifts
# Place this file in /etc/nginx/sites-available/floralwhispersgifts
# Then create symlink: sudo ln -s /etc/nginx/sites-available/floralwhispersgifts /etc/nginx/sites-enabled/
# TLS certificates are managed by Certbot (letsencrypt).

server {
    server_name floralwhispersgifts.co.ke www.floralwhispersgifts.co.ke;

    client_max_body_size 10M;
    proxy_read_timeout 300s;
    proxy_connect_timeout 75s;

    # Serve product/blog images directly from disk (no Node round-trip),
    # with a 1-year immutable cache. Both www and apex are served as-is.
    location /images/ {
        alias /var/www/sites/floralwhispersgifts.co.ke/public/images/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        tcp_nodelay on;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/floralwhispersgifts.co.ke/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/floralwhispersgifts.co.ke/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# HTTP -> HTTPS redirect (managed by Certbot)
server {
    if ($host = www.floralwhispersgifts.co.ke) {
        return 301 https://$host$request_uri;
    }

    if ($host = floralwhispersgifts.co.ke) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name floralwhispersgifts.co.ke www.floralwhispersgifts.co.ke;
    return 404;
}